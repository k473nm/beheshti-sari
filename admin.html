<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل مدیریت</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <main class="admin">
    <h1 class="page-title">پنل مدیریت</h1>

    <section id="login-box" class="card">
      <form id="login-form">
        <div class="field">
          <label for="token">توکن دسترسی گیت‌هاب</label>
          <input id="token" type="password" autocomplete="off" required>
        </div>
        <label><input id="remember" type="checkbox"> در این مرورگر به یاد داشته باش (فقط روی کامپیوتر شخصی)</label>
        <button type="submit">ورود</button>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="admin-bar">
        <span>متصل به: <b id="repo-name"></b></span>
        <button id="logout" type="button">خروج</button>
      </div>

      <h2>خبر جدید</h2>
      <form id="news-form">
        <div class="field"><label>عنوان</label><input name="title" required></div>
        <div class="field"><label>تاریخ</label><input name="date" required></div>
        <div class="field"><label>خلاصه (برای کارت خبر)</label><input name="summary" required></div>
        <div class="field"><label>متن کامل (هر خط خالی = پاراگراف جدید)</label><textarea name="body"></textarea></div>
        <div class="field"><label>عکس (اختیاری)</label><input name="image" type="file" accept="image/*"></div>
        <img id="preview" class="preview" alt="" hidden>
        <button type="submit">ثبت خبر</button>
      </form>

      <h2>اخبار موجود</h2>
      <div id="news-list"></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
