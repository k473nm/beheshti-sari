<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل مدیریت</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <main class="admin">
    <h1 class="page-title">پنل مدیریت</h1>

    <section id="login-box" class="card">
      <form id="login-form">
        <label class="field">
          <span>توکن دسترسی گیت‌هاب</span>
          <input id="token" type="password" autocomplete="off" required>
        </label>
        <label><input id="remember" type="checkbox"> در این مرورگر به یاد داشته باش (فقط روی کامپیوتر شخصی)</label>
        <button type="submit">ورود</button>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="admin-bar">
        <span>متصل به: <b id="repo-name"></b></span>
        <span class="row-actions">
          <a href="index.html" class="back">مشاهده‌ی سایت</a>
          <button id="logout" type="button" class="secondary">خروج</button>
        </span>
      </div>
      <div id="tabs" class="tabs"></div>
      <div id="editors"></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="js/common.js?v=2"></script>
  <script src="js/github.js?v=2"></script>
  <script src="js/admin-config.js?v=2"></script>
  <script src="js/admin.js?v=2"></script>
</body>
</html>
